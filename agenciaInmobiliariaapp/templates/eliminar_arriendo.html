<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Arriendo</title>
</head>
<body>
    <h1>¿Estás seguro de que deseas eliminar este arriendo?</h1>

    <p><strong>Descripción:</strong> {{ arriendo.descripcion }}</p>
    <p><strong>Dirección:</strong> {{ arriendo.direccion }}</p>
    <p><strong>Precio:</strong> ${{ arriendo.precio }}</p>

    <!-- Formulario POST necesario para realizar el borrado seguro -->
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'listar_arriendos' %}">Cancelar</a>
    </form>
</body>
</html>
